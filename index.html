<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語暗記ゲーム</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 非表示用CSS */
        .page-content {
            display: none;
        }
        /* 表示用CSS */
        .page-content.active {
            display: block;
        }
        /* メニューのスタイル */
        .nav-menu {
            display: flex;
            gap: 10px;
            list-style: none;
            padding: 0;
        }
        .nav-menu button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>ハッチョリアの提供する英単語暗記ゲーム</h1>

    <!-- 画面切り替えボタン -->
    <ul class="nav-menu">
        <li><button onclick="showPage('home')">ホーム</button></li>
        <li><button onclick="showPage('asobikata')">遊び方</button></li>
        <li><button onclick="showPage('online')">オンライン対戦</button></li>
        <li><button onclick="showPage('privacy')">プライバシーポリシー</button></li>
    </ul>

    <!-- 画面1：ホーム -->
    <div id="page-home" class="page-content active">
        <p class="sub-title">お友達や家族と一緒に暗記できます</p>
        <div class="game-link-container">
            <a href="https://hedgebirdcat.github.io/Hatchoria/" target="_blank" rel="noopener noreferrer">
                ゲームはこちらから
            </a>
        </div>
    </div>

    <!-- 画面2：目的・遊び方 -->
    <div id="page-asobikata" class="page-content">
        <h2>このゲームの目的</h2>
        <p>このゲームは，全ての英語を学ぶ日本人の単語力を向上させるためのゲームです。</p>
        <h2>遊び方</h2>
        <p>育成を開始すると，単語の問題が出てきます。</p>
        <p>答えてXPを稼ぎましょう</p>
    </div>

    <!-- 画面3：オンライン対戦 -->
    <div id="page-online" class="page-content">
        <h2>オンライン対戦について</h2>
        <p>お友達や家族と一緒にしたいときにはオンライン対戦をしましょう。</p>
    </div>

    <!-- 画面4：プライバシーポリシー -->
    <div id="page-privacy" class="page-content">
        <h2>プライバシーポリシー</h2>
        <p>ご利用いただくためにアカウント作成時に入力していただいたメールアドレスは...</p>
    </div>

    <!-- 画面切り替え用JavaScript -->
    <script>
        function showPage(pageId) {
            // 全ての画面を隠す
            const pages = document.querySelectorAll('.page-content');
            pages.forEach(page => page.classList.remove('active'));

            // 指定された画面だけ表示する
            const targetPage = document.getElementById('page-' + pageId);
            if (targetPage) {
                targetPage.classList.add('active');
            }
        }
    </script>
</body>
</html>
